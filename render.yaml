services:
  - type: web
    name: supershop
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: BASE_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: SSLCZ_STORE_ID
        sync: false
      - key: SSLCZ_STORE_PASSWORD
        sync: false
      - key: SSLCZ_MODE
        value: sandbox
