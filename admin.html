<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard — SuperShop</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="top"><div class="container nav"><div class="logo">🛒 SuperShop Admin</div><button onclick="logout()">Logout</button></div></header><main class="container section"><div class="section-title"><h1>Dashboard</h1><button class="btn" onclick="showForm()">+ Add Product</button></div><div class="benefits"><div>📦 <b id="p">0</b><small>Products</small></div><div>🧾 <b id="o">0</b><small>Orders</small></div><div>👥 <b id="c">0</b><small>Customers</small></div><div>৳ <b id="s">0</b><small>Paid Sales</small></div></div><div id="formBox" class="card" style="display:none;padding:20px;margin:25px 0"><h2 id="formTitle">Add Product</h2><form id="pf"><input type="hidden" name="id"><input required name="name" placeholder="Product name" style="width:100%;padding:10px;margin:5px 0"><input required name="category" placeholder="Category" style="width:100%;padding:10px;margin:5px 0"><input required name="price" type="number" step=".01" placeholder="Price" style="width:100%;padding:10px;margin:5px 0"><input required name="stock" type="number" placeholder="Stock" style="width:100%;padding:10px;margin:5px 0"><input name="image_url" placeholder="Image URL" style="width:100%;padding:10px;margin:5px 0"><textarea name="description" placeholder="Description" style="width:100%;padding:10px;margin:5px 0"></textarea><button class="btn">Save</button></form></div><h2>Products</h2><div id="products" class="grid"></div><h2 style="margin-top:40px">Orders</h2><div id="orders"></div></main><script>
const T=()=>localStorage.adminToken||'';const H=()=>({Authorization:'Bearer '+T(),'Content-Type':'application/json'});
async function api(u,o={}){let r=await fetch(u,{...o,headers:{...(o.headers||{}),...H()}});if(r.status===401){location.href='/admin-login.html';throw Error('login')}return r}
async function load(){let d=await (await api('/api/admin/dashboard')).json();p.textContent=d.products;o.textContent=d.orders;c.textContent=d.customers;s.textContent=d.sales.toFixed(0);let ps=await (await api('/api/products')).json();products.innerHTML=ps.map(x=>`<div class="card"><div class="pic">${x.image_url?`<img src="${x.image_url}">`:'🛒'}</div><div class="card-body"><b>${x.name}</b><p>৳${x.price} • Stock ${x.stock}</p><button onclick='edit(${JSON.stringify(x)})'>Edit</button> <button onclick='del(${x.id})'>Delete</button></div></div>`).join('');let os=await (await api('/api/admin/orders')).json();orders.innerHTML=os.map(x=>`<div class="card" style="padding:14px;margin:8px 0"><b>${x.tran_id}</b> — ${x.customer_name} — ৳${x.amount} — Payment: ${x.payment_status} <select onchange="status(${x.id},this.value)"><option ${x.order_status==='PROCESSING'?'selected':''}>PROCESSING</option><option ${x.order_status==='PACKED'?'selected':''}>PACKED</option><option ${x.order_status==='SHIPPED'?'selected':''}>SHIPPED</option><option ${x.order_status==='DELIVERED'?'selected':''}>DELIVERED</option><option ${x.order_status==='CANCELLED'?'selected':''}>CANCELLED</option></select></div>`).join('')}
function showForm(){formBox.style.display='block';pf.reset();pf.id.value=''}
function edit(x){showForm();Object.keys(x).forEach(k=>{if(pf.elements[k])pf.elements[k].value=x[k]||''})}
pf.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(pf)),id=d.id;delete d.id;let r=await api(id?'/api/admin/products/'+id:'/api/admin/products',{method:id?'PUT':'POST',body:JSON.stringify(d)});if(!r.ok)alert((await r.json()).error);else{formBox.style.display='none';load()}}
async function del(id){if(confirm('Delete this product?')){await api('/api/admin/products/'+id,{method:'DELETE'});load()}}
async function status(id,v){await api('/api/admin/orders/'+id,{method:'PUT',body:JSON.stringify({order_status:v})})}
async function logout(){await api('/api/admin/logout',{method:'POST'});localStorage.removeItem('adminToken');location.href='/admin-login.html'}
if(!T())location.href='/admin-login.html';else load();
</script></body></html>
