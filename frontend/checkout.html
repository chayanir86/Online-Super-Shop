<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — SuperShop</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="top"><div class="container nav"><a class="logo" href="/">🛒 SuperShop</a><span>Secure Checkout 🔒</span></div></header><main class="container section"><div class="card" style="padding:25px;max-width:760px;margin:auto"><h1>Checkout</h1><form id="form"><label>Full Name<br><input required name="name" style="width:100%;padding:12px;margin:6px 0 14px"></label><label>Email<br><input required type="email" name="email" style="width:100%;padding:12px;margin:6px 0 14px"></label><label>Phone<br><input required name="phone" style="width:100%;padding:12px;margin:6px 0 14px"></label><label>Delivery Address<br><textarea required name="address" style="width:100%;padding:12px;margin:6px 0 14px"></textarea></label><h3>Payment Method</h3><label><input type="radio" checked> SSLCOMMERZ — Card / Mobile Banking</label><button class="btn" style="border:0;cursor:pointer;width:100%;margin-top:22px">Proceed to SSLCOMMERZ</button></form><p id="msg"></p></div></main><script>
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const items=JSON.parse(localStorage.getItem('supershop_cart')||'[]');if(!items.length)return alert('Cart is empty');const msg=document.getElementById('msg');msg.textContent='Creating secure payment...';const o=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer:Object.fromEntries(f.entries()),items,paymentMethod:'SSLCOMMERZ'})});const od=await o.json();if(!o.ok)return msg.textContent=od.error||'Order error';const pay=await fetch('/api/payment/initiate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:od.orderId})});const pd=await pay.json();if(!pay.ok)return msg.textContent=pd.error||'Payment error';window.location.href=pd.gatewayUrl});
</script></body></html>
