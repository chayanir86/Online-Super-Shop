<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — SuperShop</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="container section"><div class="card" style="max-width:460px;margin:70px auto;padding:30px"><div class="logo">🛒 SuperShop Admin</div><h1>Admin Login</h1><form id="f"><input required name="email" type="email" placeholder="Admin email" style="width:100%;padding:12px;margin:7px 0"><input required name="password" type="password" placeholder="Password" style="width:100%;padding:12px;margin:7px 0"><button class="btn" style="border:0;width:100%;cursor:pointer">Login</button></form><p id="m"></p></div></main><script>
f.onsubmit=async e=>{e.preventDefault();let x=Object.fromEntries(new FormData(f));let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)}),d=await r.json();if(!r.ok)return m.textContent=d.error;localStorage.adminToken=d.token;location.href='/admin.html'}
</script></body></html>
