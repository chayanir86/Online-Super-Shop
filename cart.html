<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart — SuperShop</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="top"><div class="container nav"><a class="logo" href="/">🛒 SuperShop</a><a href="/">← Continue Shopping</a></div></header><main class="container section"><h1>Your Cart</h1><div id="cart"></div></main><script>
async function render(){const c=JSON.parse(localStorage.getItem('supershop_cart')||'[]');const r=await fetch('/api/products');const p=await r.json();let total=0;const rows=c.map(x=>{const a=p.find(y=>y.id===x.productId);if(!a)return '';const t=a.price*x.quantity;total+=t;return `<div class="card" style="padding:16px;margin:10px 0;display:flex;justify-content:space-between;align-items:center"><b>${a.name}</b><span>৳${a.price} × ${x.quantity} = <b>৳${t.toFixed(0)}</b></span><button style="width:auto;padding:8px 12px" onclick="removeItem(${a.id})">Remove</button></div>`}).join('');document.getElementById('cart').innerHTML=(rows||'<p>Your cart is empty.</p>')+`<div style="text-align:right;margin-top:20px"><h2>Total: ৳${total.toFixed(0)}</h2>${total?'<a class="btn" href="/checkout.html">Proceed to Checkout →</a>':''}</div>`}
function removeItem(id){let c=JSON.parse(localStorage.getItem('supershop_cart')||'[]').filter(x=>x.productId!==id);localStorage.setItem('supershop_cart',JSON.stringify(c));render()}render();
</script></body></html>
